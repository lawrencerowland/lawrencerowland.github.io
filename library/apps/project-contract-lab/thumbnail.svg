<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" role="img" aria-labelledby="title desc"><title id="title">Project Contract Lab</title><desc id="desc">A three-card contract journey above a bargaining range. Supplier minimum 45 and client maximum 55 allow a price of 50.</desc><rect width="640" height="400" fill="#f0f2e8"/><text x="40" y="47" fill="#526456" font-family="system-ui,sans-serif" font-size="13" letter-spacing="2">TWO WAYS TO READ A PROJECT CONTRACT</text><g font-family="system-ui,sans-serif" fill="#26352d"><g fill="#fffdf7" stroke="#a2b5a4"><rect x="40" y="72" width="160" height="96" rx="9"/><rect x="240" y="72" width="160" height="96" rx="9"/><rect x="440" y="72" width="160" height="96" rx="9"/></g><g font-size="19" text-anchor="middle"><text x="120" y="114">Scope</text><text x="320" y="114">Warning</text><text x="520" y="114">Payment</text></g><g font-size="12" text-anchor="middle" fill="#526456"><text x="120" y="140">What must work?</text><text x="320" y="140">What might change?</text><text x="520" y="140">What is complete?</text></g><path d="M207 120H230m-7-6 7 6-7 6M407 120h23m-7-6 7 6-7 6" fill="none" stroke="#697f62" stroke-width="2"/><text x="40" y="218" font-size="15">A separate price exercise</text><path d="M70 293H570" stroke="#a2b5a4" stroke-width="3"/><path d="M245 293H395" stroke="#cadcbc" stroke-width="26"/><path d="M245 269V316" stroke="#95602b" stroke-width="3"/><path d="M395 269V316" stroke="#456d8b" stroke-width="3"/><circle cx="320" cy="293" r="8" fill="#285d4a"/><g font-size="14" text-anchor="middle"><text x="245" y="252">Supplier minimum</text><text x="395" y="252">Client maximum</text><text x="245" y="339">45</text><text x="395" y="339">55</text><text x="320" y="376" fill="#285d4a">Price 50 · both gain 5</text></g></g></svg>
