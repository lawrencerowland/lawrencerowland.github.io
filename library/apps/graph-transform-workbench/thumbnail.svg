<svg xmlns="http://www.w3.org/2000/svg" width="960" height="520" viewBox="0 0 960 520" role="img" aria-labelledby="title desc"><title id="title">Graph-change workbench</title><desc id="desc">A three-day handoff is subdivided through an explicit interface. Three days plus zero days preserves the path weight.</desc><defs><marker id="a" viewBox="0 -5 10 10" refX="9" refY="0" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,-4L9,0L0,4" fill="#087f7b"/></marker><pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#c5d9cf"/></pattern></defs><rect width="960" height="520" rx="24" fill="#e7efe7"/><rect x="20" y="20" width="920" height="480" rx="18" fill="url(#dots)"/><g font-family="system-ui, sans-serif" fill="#172c35"><text x="55" y="64" font-size="18" letter-spacing="3" fill="#087f7b">MAKE THE HANDOFF VISIBLE</text><g stroke="#087f7b" stroke-width="4" marker-end="url(#a)"><path d="M270 170H680"/><path d="M265 355H405"/><path d="M555 355H695"/></g><g fill="#fffefa" stroke="#95b9ab" stroke-width="2"><rect x="95" y="120" width="170" height="100" rx="14"/><rect x="695" y="120" width="170" height="100" rx="14"/><rect x="95" y="305" width="170" height="100" rx="14"/><rect x="695" y="305" width="170" height="100" rx="14"/><path d="M480 290L555 355L480 420L405 355Z" fill="#cae4d4"/></g><g text-anchor="middle"><text x="180" y="169" font-size="25" font-weight="700">Prepare</text><text x="780" y="169" font-size="25" font-weight="700">Receive</text><text x="180" y="354" font-size="25" font-weight="700">Prepare</text><text x="780" y="354" font-size="25" font-weight="700">Receive</text><text x="480" y="360" font-size="22" font-weight="700">Interface</text><text x="480" y="150" font-size="21">2 transfer + 1 lag = 3 days</text><text x="334" y="335" font-size="21">3 days</text><text x="626" y="335" font-size="21">0 days</text><text x="480" y="261" font-size="17" fill="#526971">Same path weight · an explicit boundary</text><text x="480" y="467" font-size="19">Change a graph. Check what it preserves.</text></g></g></svg>
