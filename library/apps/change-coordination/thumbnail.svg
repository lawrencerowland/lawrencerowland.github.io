<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 440" role="img" aria-labelledby="title desc"><title id="title">The work stays; the boundaries move</title><desc id="desc">Two groups contain five change areas, with dashed connections between the groups and increasing bars beneath.</desc><rect width="760" height="440" rx="18" fill="#f4f1e5"/><text x="45" y="57" font-family="Georgia,serif" font-size="30" fill="#2d4a3c">The work stays; the boundaries move</text><rect x="55" y="95" width="295" height="200" rx="16" fill="#dfe8d6"/><rect x="410" y="95" width="295" height="200" rx="16" fill="#eee0c7"/><g stroke="#b18047" stroke-width="3" stroke-dasharray="7 7"><path d="M125 160L480 165M200 245L480 165M275 155L480 165M125 160L630 240M200 245L630 240M275 155L630 240"/></g><g stroke="#6b876d" stroke-width="3"><path d="M125 160L200 245L275 155Z M480 165L630 240"/></g><g fill="#3a624f"><circle cx="125" cy="160" r="17"/><circle cx="200" cy="245" r="17"/><circle cx="275" cy="155" r="17"/><circle cx="480" cy="165" r="17"/><circle cx="630" cy="240" r="17"/></g><g fill="#64866b"><rect x="60" y="375" width="38" height="20" rx="3"/><rect x="113" y="350" width="38" height="45" rx="3"/><rect x="166" y="310" width="38" height="85" rx="3"/></g><text x="245" y="355" font-family="system-ui,sans-serif" font-size="22" fill="#2d4a3c">Change the cost assumption.</text><text x="245" y="388" font-family="system-ui,sans-serif" font-size="22" fill="#2d4a3c">Count the interfaces that remain.</text></svg>
