<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" role="img" aria-labelledby="title desc"><title id="title">Portfolio scenario loom</title><desc id="desc">Four triangular activation curves overlap a decision milestone. Signed effects are shown as stress and relief, not a robustness percentage.</desc><rect width="640" height="400" rx="18" fill="#e7ede6"/><text x="34" y="42" fill="#1a6668" font-family="system-ui,sans-serif" font-size="13" letter-spacing="2">ASSUMPTIONS OVER TIME</text><g stroke="#c8d3c8"><path d="M158 64V300M270 64V300M382 64V300M494 64V300M606 64V300"/><path d="M150 125H607M150 178H607M150 231H607M150 284H607"/></g><g fill="#40585c" font-family="system-ui,sans-serif" font-size="12"><text x="30" y="117">Export controls</text><text x="30" y="170">Supply shock</text><text x="30" y="223">Price relief</text><text x="30" y="276">Skills pressure</text><text x="151" y="317">2026</text><text x="370" y="317">2027</text><text x="570" y="317">2028</text></g><path d="M158 125L270 75L382 125H606" fill="none" stroke="#7562ad" stroke-width="4"/><path d="M158 178L214 178L326 137L438 178H606" fill="none" stroke="#bf7159" stroke-width="4"/><path d="M158 231H270L382 188L550 231H606" fill="none" stroke="#398065" stroke-width="4"/><path d="M158 284H214L382 245L550 284H606" fill="none" stroke="#7562ad" stroke-width="4"/><path d="M350 61V299" stroke="#a46b20" stroke-width="2" stroke-dasharray="6 5"/><text x="362" y="70" fill="#885919" font-family="system-ui,sans-serif" font-size="12">Decision month</text><rect x="31" y="344" width="578" height="32" rx="7" fill="#fffef9"/><text x="47" y="365" fill="#26484c" font-family="system-ui,sans-serif" font-size="13">Stress + relief → signed pressure, with assumptions visible</text></svg>
