<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc"><title id="title">Regulatory Negotiation Rehearsal</title><desc id="desc">A coalition network connects seven parties to a signed contribution table and a separate consent sketch on warm paper.</desc><rect width="1200" height="720" fill="#f7f5eb"/><text x="64" y="74" font-family="system-ui,sans-serif" font-size="18" letter-spacing="3" fill="#536858">DECISIONS &amp; TRADE-OFFS</text><text x="64" y="136" font-family="system-ui,sans-serif" font-size="42" fill="#193b2c">Rehearse the package.</text><text x="64" y="188" font-family="system-ui,sans-serif" font-size="42" fill="#193b2c">Inspect the assumptions.</text><rect x="64" y="240" width="510" height="396" rx="18" fill="#fffdf6" stroke="#cdd7c9"/><g stroke="#b6c4b3" stroke-width="4"><path d="M320 300L475 385L440 530L225 550L140 405ZM320 300L315 440L475 385M140 405L315 440L225 550M315 440L440 530" fill="none"/></g><g fill="#426f50" stroke="#193b2c" stroke-width="3"><circle cx="320" cy="300" r="36"/><circle cx="475" cy="385" r="31"/><circle cx="440" cy="530" r="27"/><circle cx="225" cy="550" r="26"/><circle cx="140" cy="405" r="29"/><circle cx="315" cy="440" r="52"/><circle cx="365" cy="598" r="20"/></g><g fill="white" font-family="system-ui,sans-serif" font-size="14" text-anchor="middle"><text x="320" y="305">ONR</text><text x="475" y="390">EA</text><text x="315" y="445">Operator</text></g><rect x="604" y="240" width="532" height="236" rx="18" fill="#fffdf6" stroke="#cdd7c9"/><text x="635" y="283" fill="#193b2c" font-family="system-ui,sans-serif" font-size="23">Signed contribution · φ</text><path d="M655 321H929M655 367H836M655 413H735" stroke="#426f50" stroke-width="20"/><path d="M985 316v105" stroke="#cdd7c9"/><text x="1010" y="329" fill="#536858" font-family="system-ui,sans-serif" font-size="16">worth</text><text x="1010" y="373" fill="#536858" font-family="system-ui,sans-serif" font-size="16">≠ consent</text><text x="1010" y="417" fill="#536858" font-family="system-ui,sans-serif" font-size="16">≠ payment</text><rect x="604" y="500" width="532" height="136" rx="18" fill="#e5eddc" stroke="#cdd7c9"/><text x="635" y="543" fill="#193b2c" font-family="system-ui,sans-serif" font-size="21">Can a coalition object?</text><text x="635" y="584" fill="#536858" font-family="system-ui,sans-serif" font-size="19">Compare worth with its allocated share.</text><text x="65" y="684" fill="#536858" font-family="system-ui,sans-serif" font-size="17">A hypothetical model with exact attribution and replayable assumptions.</text></svg>
