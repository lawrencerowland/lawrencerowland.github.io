- id: buffer-day
  role: bounded-worked-example
  title: "What does another day of buffer buy?"
  topic: "Schedule & risk assumptions"
  canonical_url: "https://lawrencerowland.github.io/library/apps/project-risk-gradient/"
  image: "/images/scenarios/buffer-day.svg"
  image_alt: "A seven-task software project branches through development and testing, and documentation and training, before deployment; buffer is shown beside two tasks"
  problem: "Allocate protective buffer across a seven-task software project. Compare the reduction in its illustrative risk index with the effect on the commitment date."
  action: "Explore the buffer example"
  inputs: "A fixed task network, supplied durations and risk coefficients, and a buffer setting of zero to ten days per task."
  try: "Start from reset. Add one day to Development, then reset and add one day to Documentation. Compare the risk-index change and finish-date effect; inspect the network to understand the difference."
  limitation: "This is an uncalibrated teaching model. Risk follows a supplied exponential formula with fixed baseline weights and slack. Finish-date effects are calculated separately; the ranking does not establish real risk reduction or an optimal allocation."
