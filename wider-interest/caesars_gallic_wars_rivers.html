<script>
  const references = [{"seq": 1, "river": "Garonne", "sentence": "The river Garonne separates the Gauls from the Aquitani; the Marne and the Seine separate them from the Belgae."}, {"seq": 2, "river": "Rhine", "sentence": "Of all these, the Belgae are the bravest, because they are furthest from the civilization and refinement of [our] Province, and merchants least frequently resort to them, and import those things which tend to effeminate the mind; and they are the nearest to the Germans, who dwell beyond the Rhine, with whom they are continually waging war; for which reason the Helvetii also surpass the rest of the Gauls in valor, as they contend with the Germans in almost daily battles, when they either repel them from their own territories, or themselves wage war on their frontiers."}, {"seq": 3, "river": "Garonne", "sentence": "One part of these, which it has been said that the Gauls occupy, takes its beginning at the river Rhone; it is bounded by the river Garonne, the ocean, and the territories of the Belgae; it borders, too, on the side of the Sequani and the Helvetii, upon the river Rhine, and stretches toward the north."}, {"seq": 4, "river": "Rhine", "sentence": "The Belgae rises from the extreme frontier of Gaul, extend to the lower part of the river Rhine; and look toward the north and the rising sun."}, {"seq": 5, "river": "Garonne", "sentence": "Aquitania extends from the river Garonne to the Pyrenaean mountains and to that part of the ocean which is near Spain: it looks between the setting of the sun, and the north star."}, {"seq": 6, "river": "Rhine", "sentence": "To this he the more easily persuaded them, because the Helvetii, are confined on every side by the nature of their situation; on one side by the Rhine, a very broad and deep river, which separates the Helvetian territory from the Germans; on a second side by the Jura, a very high mountain, which is [situated] between the Sequani and the Helvetii; on a third by the Lake of Geneva, and by the river Rhone, which separates our Province from the Helvetii."}, {"seq": 7, "river": "Rhine", "sentence": "They persuade the Rauraci, and the Tulingi, and the Latobrigi, their neighbors, to adopt the same plan, and after burning down their towns and villages, to set out with them: and they admit to their party and unite to themselves as confederates the Boii, who had dwelt on the other side of the Rhine, and had crossed over into the Norican territory, and assaulted Noreia."}, {"seq": 8, "river": "Rhone", "sentence": "1:6 There were in all two routes, by which they could go forth from their country one through the Sequani narrow and difficult, between Mount Jura and the river Rhone (by which scarcely one wagon at a time could be led; there was, moreover, a very high mountain overhanging, so that a very few might easily intercept them; the other, through our Province, much easier and freer from obstacles, because the Rhone flows between the boundaries of the Helvetii and those of the Allobroges, who had lately been subdued, and is in some places crossed by a ford."}, {"seq": 9, "river": "Rhone", "sentence": "Having provided every thing for the expedition, they appoint a day, on which they should all meet on the bank of the Rhone."}, {"seq": 10, "river": "Rhone", "sentence": "1:8 Meanwhile, with the legion which he had with him and the soldiers which had assembled from the Province, he carries along for nineteen [Roman, not quite eighteen English] miles a wall, to the height of sixteen feet, and a trench, from the Lake of Geneva, which flows into the river Rhone, to Mount Jura, which separates the territories of the Sequani from those of the Helvetii."}, {"seq": 11, "river": "Rhone", "sentence": "The Helvetii, disappointed in this hope, tried if they could force a passage (some by means of a bridge of boats and numerous rafts constructed for the purpose; others, by the fords of the Rhone, where the depth of the river was least, sometimes by day, but more frequently by night), but being kept at bay by the strength of our works, and by the concourse of the soldiers, and by the missiles, they desisted from this attempt."}, {"seq": 12, "river": "Rhone", "sentence": "These people are the first beyond the Province on the opposite side of the Rhone."}, {"seq": 13, "river": "Rhone", "sentence": "At the same time the Ambarri, the friends and kinsmen of the Aedui, apprize Caesar, that it was not easy for them, now that their fields had been devastated, to ward off the violence of the enemy from their towns: the Allobroges likewise, who had villages and possessions on the other side of the Rhone, betake themselves in flight to Caesar, and assure him that they had nothing remaining, except the soil of their land."}, {"seq": 14, "river": "Rhone", "sentence": "1:12 There is a river [called] the Saone, which flows through the territories of the Aedui and Sequani into the Rhone with such incredible slowness, that it can not be determined by the eye in which direction it flows."}, {"seq": 15, "river": "Saone", "sentence": "When Caesar was informed by spies that the Helvetii had already conveyed three parts of their forces across that river, but that the fourth part was left behind on this side of the Saone, he set out from the camp with three legions during the third watch, and came up with that division which had not yet crossed the river."}, {"seq": 16, "river": "Saone", "sentence": "1:13 This battle ended, that he might be able to come up with the remaining forces of the Helvetii, he procures a bridge to be made across the Saone, and thus leads his army over."}, {"seq": 17, "river": "Saone", "sentence": "1:16 Meanwhile, Caesar kept daily importuning the Aedui for the corn which they had promised in the name of their state; for, in consequence of the coldness (Gaul, being as before said, situated toward the north), not only was the corn in the fields not ripe, but there was not in store a sufficiently large quantity even of fodder: besides he was unable to use the corn which he had conveyed in ships up the river Saone, because the Helvetii, from whom he was unwilling to retire had diverted their march from the Saone."}, {"seq": 18, "river": "Rhine", "sentence": "While those things are being sought for and got together, after a night's interval, about 6000 men of that canton which is called the Verbigene, whether terrified by fear, lest after delivering up their arms, they should suffer punishment, or else induced by the hope of safety, because they supposed that, amid so vast a multitude of those who had surrendered themselves, their flight might either be concealed or entirely overlooked, having at night-fall departed out of the camp of the Helvetii, hastened to the Rhine and the territories of the Germans."}, {"seq": 19, "river": "Rhine", "sentence": "This he did, chiefly, on this account, because he was unwilling that the country, from which the Helvetii had departed, should be untenanted, lest the Germans, who dwell on the other side of the Rhine, should, on account of the excellence of the lands, cross over from their own territories into those of the Helvetii, and become borderers upon the province of Gaul and the Allobroges."}, {"seq": 20, "river": "Rhine", "sentence": "of the Germans] had at first crossed the Rhine: but after that these wild and savage men had become enamored of the lands and the refinement and the abundance of the Gauls, more were brought over, that there were now as many as 120,000 of them in Gaul: that with these the Aedui and their dependents had repeatedly struggled in arms--that they had been routed, and had sustained a great calamity--had lost all their nobility, all their senate, all their cavalry."}, {"seq": 21, "river": "Rhine", "sentence": "The consequence would be, that in a few years they would all be driven from the territories of Gaul, and all the Germans would cross the Rhine; for neither must the land of Gaul be compared with the land of the Germans, nor must the habit of living of the latter be put on a level with that of the former."}, {"seq": 22, "river": "Rhine", "sentence": "If these things were to be disclosed to Ariovistus, [Divitiacus adds] that he doubts not that he would inflict the most severe punishment on all the hostages who are in his possession, [and says] that Caesar could, either by his own influence and by that of his army, or by his late victory, or by name of the Roman people, intimidate him, so as to prevent a greater number of Germans being brought over the Rhine, and could protect all Gaul from the outrages of Ariovistus."}, {"seq": 23, "river": "Rhine", "sentence": "That, moreover, the Germans should by degrees become accustomed to cross the Rhine, and that a great body of them should come into Gaul, he saw [would be] dangerous to the Roman people, and judged, that wild and savage men would not be likely to restrain themselves, after they had possessed themselves of all Gaul, from going forth into the province and thence marching into Italy (as the Cimbri and Teutones had done before them), particularly as the Rhone [was the sole barrier that] separated the Sequani from our province."}, {"seq": 24, "river": "Rhine", "sentence": "\"Since, after having been treated with so much kindness by himself and the Roman people (as he had in his consulship been styled 'king and friend' by the senate), he makes this recompense to [Caesar] himself and the Roman people, [viz.] that when invited to a conference he demurs, and does not think that it concerns him to advise and inform himself about an object of mutual interest, these are the things which he requires of him; first, that he do not any more bring over any body of men across the Rhine into Gaul; in the next place, that he restore the hostages, which he has from the Aedui, and grant the Sequani permission to restore to them with his consent those hostages which they have, and that he neither provoke the Aedui by outrage nor make war upon them or their allies; if he would accordingly do this,\" [Caesar says] that \"he himself and the Roman people will entertain a perpetual feeling of favor and friendship toward him; but that if he [Caesar] does not obtain [his desires] that he (forasmuch as in the consulship of Marcus Messala and Marcus Piso the senate had decreed that, whoever should have the administration of the province of Gaul should, as far as he could do so consistently with the interests of the republic, protect the Aedui and the other friends of the Roman people), will not overlook the wrongs of the Aedui.\" His responsis ad Caesarem relatis, iterum ad eum Caesar legatos cum his mandatis mittit: quoniam tanto suo populique Romani beneficio adtectus, cum in consulatu suo rex atque amicus a senatu appellatus esset, hanc sibi populoque Romano gratiam referret ut in conloquium venire invitatus gravaretur neque de communi re dicendum sibi et cognoscendum putaret, haec esse quae ab eo postularet: primum ne quam multitudinem hominum amplius trans Rhenum in Galliam traduceret; deinde obsides quos haberet ab Haeduis redderet Sequanisque permitteret ut quos illi haberent voluntate eius reddere illis liceret; neve Haeduos iniuria lacesseret neve his sociisque eorum bellum inferret."}, {"seq": 25, "river": "Rhine", "sentence": "1:37 At the same time that this message was delivered to Caesar, embassadors came from the Aedui and the Treviri; from the Aedui to complain that the Harudes, who had lately been brought over into Gaul, were ravaging their territories; that they had not been able to purchase peace from Ariovistus, even by giving hostages: and from the Treviri, [to state] that a hundred cantons of the Suevi had encamped on the banks of the Rhine, and were attempting to cross it; that the brothers, Nasuas and Cimberius, headed them."}, {"seq": 26, "river": "Doubs", "sentence": "Caesar thought that he ought to take the greatest precautions lest this should happen, for there was in that town a most ample supply of every thing which was serviceable for war; and so fortified was it by the nature of the ground, as to afford a great facility for protracting the war, inasmuch as the river Doubs almost surrounds the whole town, as though it were traced round it with a pair of compasses."}, {"seq": 27, "river": "Rhine", "sentence": "He informed him too, how old and how just were the grounds of connection that existed between themselves [the Romans] and the Aedui, what decrees of the senate had been passed in their favor, and how frequent and how honorable; how from time immemorial the Aedui had held the supremacy of the whole of Gaul; even [said Caesar] before they had sought our friendship; that it was the custom of the Roman people to desire not only that its allies and friends should lose none of their property, but be advanced in influence, dignity, and honor: who then could endure that what they had brought with them to the friendship of the Roman people should be torn from them?\" He then made the same demands which he had commissioned the embassadors to make, that [Ariovistus] should not make war either upon the Aedui or their allies, that he should restore the hostages; that if he could not send back to their country any part of the Germans, he should at all events suffer none of them any more to cross the Rhine."}, {"seq": 28, "river": "Rhine", "sentence": "1:44 Ariovistus briefly replied to the demands of Caesar; but expatiated largely on his own virtues, \"that he had crossed the Rhine not of his own accord, but on being invited and sent for by the Gauls; that he had not left home and kindred without great expectations and great rewards; that he had settlements in Gaul, granted by the Gauls themselves; that the hostages had been given by their good-will; that he took by right of war the tribute which conquerors are accustomed to impose on the conquered; that he had not made war upon the Gauls, but the Gauls upon him; that all the states of Gaul came to attack him, and had encamped against him; that all their forces had been routed and beaten by him in a single battle; that if they chose to make a second trial, he was ready to encounter them again; but if they chose to enjoy peace, it was unfair to refuse the tribute, which of their own free-will they had paid up to that time."}, {"seq": 29, "river": "Rhine", "sentence": "1:53 Thereupon the engagement was renewed, and all the enemy turned their backs, nor did they cease to flee until they arrived at the river Rhine, about fifty miles from that place."}, {"seq": 30, "river": "Rhine", "sentence": "1:54 This battle having been reported beyond the Rhine, the Suevi, who had come to the banks of that river, began to return home, when the Ubii, who dwelt nearest to the Rhine, pursuing them, while much alarmed, slew a great number of them."}, {"seq": 31, "river": "Garonne", "sentence": "The river Garonne separates the Gauls from the Aquitani; the Marne and the Seine separate them from the Belgae."}, {"seq": 32, "river": "Rhine", "sentence": "Of all these, the Belgae are the bravest, because they are furthest from the civilization and refinement of [our] Province, and merchants least frequently resort to them, and import those things which tend to effeminate the mind; and they are the nearest to the Germans, who dwell beyond the Rhine, with whom they are continually waging war; for which reason the Helvetii also surpass the rest of the Gauls in valor, as they contend with the Germans in almost daily battles, when they either repel them from their own territories, or themselves wage war on their frontiers."}, {"seq": 33, "river": "Garonne", "sentence": "One part of these, which it has been said that the Gauls occupy, takes its beginning at the river Rhone; it is bounded by the river Garonne, the ocean, and the territories of the Belgae; it borders, too, on the side of the Sequani and the Helvetii, upon the river Rhine, and stretches toward the north."}, {"seq": 34, "river": "Rhine", "sentence": " iniuria lacesseret neve his sociisque eorum bellum inferret."}, {"seq": 55, "river": "Rhine", "sentence": "1:37 At the same time that this message was delivered to Caesar, embassadors came from the Aedui and the Treviri; from the Aedui to complain that the Harudes, who had lately been brought over into Gaul, were ravaging their territories; that they had not been able to purchase peace from Ariovistus, even by giving hostages: and from the Treviri, [to state] that a hundred cantons of the Suevi had encamped on the banks of the Rhine, and were attempting to cross it; that the brothers, Nasuas and Cimberius, headed them."}, {"seq": 56, "river": "Doubs", "sentence": "Caesar thought that he ought to take the greatest precautions lest this should happen, for there was in that town a most ample supply of every thing which was serviceable for war; and so fortified was it by the nature of the ground, as to afford a great facility for protracting the war, inasmuch as the river Doubs almost surrounds the whole town, as though it were traced round it with a pair of compasses."}, {"seq": 57, "river": "Rhine", "sentence": "He informed him too, how old and how just were the grounds of connection that existed between themselves [the Romans] and the Aedui, what decrees of the senate had been passed in their favor, and how frequent and how honorable; how from time immemorial the Aedui had held the supremacy of the whole of Gaul; even [said Caesar] before they had sought our friendship; that it was the custom of the Roman people to desire not only that its allies and friends should lose none of their property, but be advanced in influence, dignity, and honor: who then could endure that what they had brought with them to the friendship of the Roman people should be torn from them?\" He then made the same demands which he had commissioned the embassadors to make, that [Ariovistus] should not make war either upon the Aedui or their allies, that he should restore the hostages; that if he could not send back to their country any part of the Germans, he should at all events suffer none of them any more to cross the Rhine."}, {"seq": 58, "river": "Rhine", "sentence": "1:44 Ariovistus briefly replied to the demands of Caesar; but expatiated largely on his own virtues, \"that he had crossed the Rhine not of his own accord, but on being invited and sent for by the Gauls; that he had not left home and kindred without great expectations and great rewards; that he had settlements in Gaul, granted by the Gauls themselves; that the hostages had been given by their good-will; that he took by right of war the tribute which conquerors are accustomed to impose on the conquered; that he had not made war upon the Gauls, but the Gauls upon him; that all the states of Gaul came to attack him, and had encamped against him; that all their forces had been routed and beaten by him in a single battle; that if they chose to make a second trial, he was ready to encounter them again; but if they chose to enjoy peace, it was unfair to refuse the tribute, which of their own free-will they had paid up to that time."}, {"seq": 59, "river": "Rhine", "sentence": "1:53 Thereupon the engagement was renewed, and all the enemy turned their backs, nor did they cease to flee until they arrived at the river Rhine, about fifty miles from that place."}, {"seq": 60, "river": "Rhine", "sentence": "1:54 This battle having been reported beyond the Rhine, the Suevi, who had come to the banks of that river, began to return home, when the Ubii, who dwelt nearest to the Rhine, pursuing them, while much alarmed, slew a great number of them."}, {"seq": 61, "river": "Rhine", "sentence": "2:3 As he arrived there unexpectedly and sooner than any one anticipated, the Remi, who are the nearest of the Belgae to [Celtic] Gaul, sent to him Iccius and Antebrogius, [two of] the principal persons of the state, as their embassadors: to tell him that they surrendered themselves and all their possessions to the protection and disposal of the Roman people: and that they had neither combined with the rest of the Belgae, nor entered into any confederacy against the Roman people: and were prepared to give hostages, to obey his commands, to receive him into their towns, and to aid him with corn and other things; that all the rest of the Belgae were in arms; and that the Germans, who dwell on this side of the Rhine, had joined themselves to them; and that so great was the infatuation of them all, that they could not restrain even the Suessiones, their own brethren and kinsmen, who enjoy the same rights, and the, same laws, and who have one government and one magistracy [in common] with themselves, from uniting with them."}, {"seq": 62, "river": "Rhine", "sentence": "2:4 When Caesar inquired of them what states were in arms, how powerful they were, and what they could do, in war, he received the following information: that the greater part of the Belgae were sprung, from the Germans, and that having crossed the Rhine at an early period, they had settled there, on account of the fertility of the country, and had driven out the Gauls who inhabited those regions; and that they were the only people who, in the memory of our fathers, when all Gaul was overrun, had prevented the Teutones and the Cimbri from entering their territories; the effect of which was, that, from the recollection of those events, they assumed to themselves great authority and haughtiness in military matters."}, {"seq": 63, "river": "Aisne", "sentence": "After he perceived that all the forces of the Belgae, which had been collected in one place, were approaching toward him, and learned from the scouts whom he had sent out, and [also] from the Remi, that they were then not far distant, he hastened to lead his army over the Aisne, which is on the borders of the Remi, and there pitched his camp."}, {"seq": 64, "river": "Aisne", "sentence": "The enemy immediately hastened from that place to the river Aisne, which it has been; stated was behind our camp."}, {"seq": 65, "river": "Sambre", "sentence": "2:16 After he had made three days march through their territories, he discovered from some prisoners, that the river Sambre was not more than ten miles from his camp; that all the Nervii had stationed themselves on the other side of that river, and together with the Atrebates and the Veromandui, their neighbors, were there awaiting the arrival of the Romans; for they had persuaded both these nations to try the same fortune of war [as themselves]: that the forces of the Aduatuci were also expected by them, and were on their march; that they had put their women, and those who through age appeared useless for war, in a place to which there was no approach for an army, on account of the marshes."}, {"seq": 66, "river": "Sambre", "sentence": "2:18 The nature of the ground which our men had chosen for the camp was this: A hill, declining evenly from the top, extending to the river Sambre, which we have mentioned above: from this river there arose a [second] hill of like ascent, on the other side and opposite to the former, and open for about 200 paces at the lower part; but in the upper part, woody, (so much so) that it was not easy to see through it into the interior."}, {"seq": 67, "river": "Rhine", "sentence": "They were descended from the Cimbri and Teutones, who, when they were marching into our province and Italy, having deposited on this side the river Rhine such of their baggage-trains as they could not drive or convey with them, left 6,000 of their men as a guard and defense for them."}, {"seq": 68, "river": "Rhine", "sentence": "2:35 These things being achieved, [and] all Gaul being subdued, so high an opinion of this war was spread among the barbarians, that embassadors were sent to Caesar by those nations who dwelt beyond the Rhine, to promise that they would give hostages and execute his commands."}, {"seq": 69, "river": "Rhine", "sentence": "2:3 As he arrived there unexpectedly and sooner than any one anticipated, the Remi, who are the nearest of the Belgae to [Celtic] Gaul, sent to him Iccius and Antebrogius, [two of] the principal persons of the state, as their embassadors: to tell him that they surrendered themselves and all their possessions to the protection and disposal of the Roman people: and that they had neither combined with the rest of the Belgae, nor entered into any confederacy against the Roman people: and were prepared to give hostages, to obey his commands, to receive him into their towns, and to aid him with corn and other things; that all the rest of the Belgae were in arms; and that the Germans, who dwell on this side of the Rhine, had joined themselves to them; and that so great was the infatuation of them all, that they could not restrain even the Suessiones, their own brethren and kinsmen, who enjoy the same rights, and the, same laws, and who have one government and one magistracy [in common] with themselves, from uniting with them."}, {"seq": 70, "river": "Rhine", "sentence": "2:4 When Caesar inquired of them what states were in arms, how powerful they were, and what they could do, in war, he received the following information: that the greater part of the Belgae were sprung, from the Germans, and that having crossed the Rhine at an early period, they had settled there, on account of the fertility of the country, and had driven out the Gauls who inhabited those regions; and that they were the only people who, in the memory of our fathers, when all Gaul was overrun, had prevented the Teutones and the Cimbri from entering their territories; the effect of which was, that, from the recollection of those events, they assumed to themselves great authority and haughtiness in military matters."}, {"seq": 71, "river": "Aisne", "sentence": "After he perceived that all the forces of the Belgae, which had been collected in one place, were approaching toward him, and learned from the scouts whom he had sent out, and [also] from the Remi, that they were then not far distant, he hastened to lead his army over the Aisne, which is on the borders of the Remi, and there pitched his camp."}, {"seq": 72, "river": "Aisne", "sentence": "The enemy immediately hastened from that place to the river Aisne, which it has been; stated was behind our camp."}, {"seq": 73, "river": "Sambre", "sentence": "2:16 After he had made three days march through their territories, he discovered from some prisoners, that the river Sambre was not more than ten miles from his camp; that all the Nervii had stationed themselves on the other side of that river, and together with the Atrebates and the Veromandui, their neighbors, were there awaiting the arrival of the Romans; for they had persuaded both these nations to try the same fortune of war [as themselves]: that the forces of the Aduatuci were also expected by them, and were on their march; that they had put their women, and those who through age appeared useless for war, in a place to which there was no approach for an army, on account of the marshes."}, {"seq": 74, "river": "Sambre", "sentence": "2:18 The nature of the ground which our men had chosen for the camp was this: A hill, declining evenly from the top, extending to the river Sambre, which we have mentioned above: from this river there arose a [second] hill of like ascent, on the other side and opposite to the former, and open for about 200 paces at the lower part; but in the upper part, woody, (so much so) that it was not easy to see through it into the interior."}, {"seq": 75, "river": "Rhine", "sentence": "They were descended from the Cimbri and Teutones, who, when they were marching into our province and Italy, having deposited on this side the river Rhine such of their baggage-trains as they could not drive or convey with them, left 6,000 of their men as a guard and defense for them."}, {"seq": 76, "river": "Rhine", "sentence": "2:35 These things being achieved, [and] all Gaul being subdued, so high an opinion of this war was spread among the barbarians, that embassadors were sent to Caesar by those nations who dwelt beyond the Rhine, to promise that they would give hostages and execute his commands."}, {"seq": 77, "river": "Rhone", "sentence": "Bohn [1869], at sacred-texts.com Gallic Wars Book 3 (56 B.C.E.) 3:1 When Caesar was setting out for Italy, he sent Servius Galba with the twelfth legion and part of the cavalry, against the Nantuates, the Veragri, and Seduni, who extend from the territories of the Allobroges, and the lake of Geneva, and the River Rhone to the top of the Alps."}, {"seq": 78, "river": "Loire", "sentence": "3:9 Caesar, being informed of these things by Crassus, since he was so far distant himself, orders ships of war to be built in the mean time on the river Loire, which flows into the ocean; rowers to be raised from the province; sailors and pilots to be provided."}, {"seq": 79, "river": "Rhine", "sentence": "Labienus, his lieutenant, with the cavalry to the Treviri, who are nearest to the river Rhine."}, {"seq": 80, "river": "Rhine", "sentence": "Crassus were consuls), those Germans [called] the Usipetes, and likewise the Tenchtheri, with a great number of men, crossed the Rhine, not far from the place at which that river discharges itself into the sea."}, {"seq": 81, "river": "Rhine", "sentence": "On the other side they border on the Ubii, whose state was large and flourishing, considering the condition of the Germans, and who are somewhat more refined than those of the same race and the rest [of the Germans], and that because they border on the Rhine, and are much resorted to by merchants, and are accustomed to the manners of the Gauls, by reason of their approximity to them."}, {"seq": 82, "river": "Rhine", "sentence": "4:4 In the same condition were the Usipetes and the Tenchtheri (whom we have mentioned above), who, for many years, resisted the power of the Suevi, but being at last driven from their possessions, and having wandered through many parts of Germany, came to the Rhine, to districts which the Menapii inhabited, and where they had lands, houses, and villages on either side of the river."}, {"seq": 83, "river": "Rhine", "sentence": "The latter people, alarmed by the arrival of so great a multitude, removed from those houses which they had on the other side of the river, and having placed guards on this side the Rhine, proceeded to hinder the Germans from crossing."}, {"seq": 84, "river": "Rhine", "sentence": "They, finding themselves, after they had tried all means, unable either to force a passage on account of their deficiency in shipping, or cross by stealth on account of the guards of the Menapii, pretended to return to their own settlements and districts; and, after having proceeded three days' march, returned; and their cavalry having performed the whole of this journey in one night, cut off the Menapii, who were ignorant of, and did not expect [their approach, and] who, having moreover been informed of the departure of the Germans by their scouts, had, without apprehension, returned to their villages beyond the Rhine."}, {"seq": 85, "river": "Rhine", "sentence": "Having slain these, and seized their ships, they crossed the river before that part of the Menapii, who were at peace in their settlements over the Rhine, were apprized of [their intention]; and seizing all their houses, maintained themselves upon their provisions during the rest of the winter."}, {"seq": 86, "river": "Rhine", "sentence": "When he had arrived there, he discovered that those things, which he had suspected would occur, had taken place; that embassies had been sent to the Germans by some of the states, and that they had been entreated to leave the Rhine, and had been promised that all things which they desired should be provided by the Gauls."}, {"seq": 87, "river": "Rhine", "sentence": "4:10 The Meuse rises from mount Le Vosge, which is in the territories of the Lingones; and, having received a branch of the Rhine, which is called the Waal, forms the island of the Batavi, and not more than eighty miles from it it falls into the ocean."}, {"seq": 88, "river": "Rhine", "sentence": "But the Rhine takes its source among the Lepontii, who inhabit the Alps, and is carried with a rapid current for a long distance through the territories of the Sarunates, Helvetii, Sequani, Mediomatrici, Tribuci, and Treviri, and when it approaches the ocean, divides into several branches; and, having formed many and extensive islands, a great part of which are inhabited by savage and barbarous nations (of whom there are some who are supposed to live on fish and the eggs of sea-fowl), flows into the ocean by several mouths."}, {"seq": 89, "river": "Rhine", "sentence": "Their consternation being made apparent by their noise and tumult, our soldiers, excited by the treachery of the preceding day, rushed into the camp: such of them as could readily get their arms, for a short time withstood our men, and gave battle among their carts and baggage wagons; but the rest of the people, [consisting] of boys and women (for they had left their country and crossed the Rhine with all their families) began to fly in all directions; in pursuit of whom Caesar sent the cavalry."}, {"seq": 90, "river": "Rhine", "sentence": "4:15 The Germans when, upon hearing a noise behind them, [they looked and] saw that their families were being slain, throwing away their arms and abandoning their standards, fled out of the camp, and when they had arrived at the confluence of the Meuse and the Rhine, the survivors despairing of further escape, as a great number of their countrymen had been killed, threw themselves into the river and there perished, overcome by fear, fatigue, and the violence of the stream."}, {"seq": 91, "river": "Rhine", "sentence": "4:16 The German war being finished, Caesar thought it expedient for him to cross the Rhine, for many reasons; of which this was the most weighty, that, since he saw the Germans were so easily urged to go into Gaul, he desired they should have their fears for their own territories, when they discovered that the army of the Roman people both could and dared pass the Rhine."}, {"seq": 92, "river": "Rhine", "sentence": "There was added also, that portion of the cavalry of the Usipetes and the Tenchtheri, which I have above related to have crossed the Meuse for the purpose of plundering and procuring forage, and was not present at the engagement, had betaken themselves, after the retreat of their countrymen, across the Rhine into the territories of the Sigambri, and united themselves to them."}, {"seq": 93, "river": "Rhine", "sentence": "When Caesar sent embassadors to them, to demand that they should give up to him those who had made war against him and against Gaul, they replied, \"That the Rhine bounded the empire of the Roman people; if he did not think it just for the Germans to pass over into Gaul against his consent, why did he claim that any thing beyond the Rhine should be subject to his dominion or power?\" The Ubii, also, who alone, out of all the nations lying beyond the Rhine, had sent embassadors to Caesar, and formed an alliance and given hostages, earnestly entreated \"that he would bring them assistance, because they were grievously oppressed by the Suevi; or, if he was prevented from doing so by the business of the commonwealth, he would at least transport his army over the Rhine; that that would be sufficient for their present assistance and their hope for the future; that so great was the name and the reputation of his army, even among the most remote nations of the Germans, arising from the defeat of Ariovistus and this last battle which was fought, that they might be safe under the fame and friendship of the Roman people.\" They promised a large number of ships for transporting the army."}, {"seq": 94, "river": "Rhine", "sentence": "4:17 Caesar, for those reasons which I have mentioned, had resolved to cross the Rhine; but to cross by ships he neither deemed to be sufficiently safe, nor considered consistent with his own dignity or that of the Roman people."}, {"seq": 95, "river": "Rhine", "sentence": "When Caesar discovered this, having already accomplished all these things on account of which he had resolved to lead his army over, namely, to strike fear into the Germans, take vengeance on the Sigambri, and free the Ubii from the invasion of the Suevi, having spent altogether eighteen days beyond the Rhine, and thinking he had advanced far enough to serve both honor and interest, he returned into Gaul, and cut down the bridge."}, {"seq": 96, "river": "Rhine", "sentence": "He left what seemed a sufficient number of soldiers for that design; he himself proceeds into the territories of the Treviri with four legions without baggage, and 800 horse, because they neither came to the general diets [of Gaul], nor obeyed his commands, and were moreover, said to be tampering with the Germans beyond the Rhine."}, {"seq": 97, "river": "Rhine", "sentence": "5:3 This state is by far the most powerful of all Gaul in cavalry, and has great forces of infantry, and as we have remarked above, borders on the Rhine."}, {"seq": 98, "river": "Rhine", "sentence": "But Indutiomarus began to collect cavalry and infantry, and make preparations for war, having concealed those who by reason of their age could not be under arms, in the forest Arduenna, which is of immense size, [and] extends from the Rhine across the country of the Treviri to the frontiers of the Remi."}, {"seq": 99, "river": "Rhine", "sentence": "One legion which he had raised last on the other side of the Po, and five cohorts, he sent among the Eburones, the greatest portion of whom lie between the Meuse and the Rhine, [and] who were under the government of Ambiorix and Cativolcus."}, {"seq": 100, "river": "Rhine", "sentence": "Since he had performed his duty to them on the score of patriotism [he said], he has now regard to gratitude for the kindness of Caesar; that he warned, that he prayed Titurius by the claims of hospitality, to consult for his and his soldiers' safely; that a large force of the Germans had been hired and had passed the Rhine; that it would arrive in two days: that it was for them to consider whether they thought fit, before the nearest people perceived it, to lead off their soldiers when drawn out of winter-quarters, either to Cicero or to Labienus; one of whom was about fifty miles distant from them, the other rather more; that this he promised and confirmed by oath, that he would give them a safe passage through his territories; and when he did that, he was both consulting for his own state, because it would be relieved from the winter-quarters, and also making a requital to Caesar for his obligations.\" Mittitur ad eos colloquendi causa Gaius Arpineius, eques Romanus, familiaris Quinti Tituri, et Quintus Iunius ex Hispania quidam, qui iam ante missu Caesaris ad Ambiorigem ventitare consuerat; apud quos Ambiorix ad hunc modum locutus est: Sese pro Caesaris in se beneficiis plurimum ei confiteri debere, quod eius opera stipendio liberatus esset, quod Aduatucis, finitimis suis, pendere consuesset, quodque ei et filius et fratris filius ab Caesare remissi essent, quos Aduatuci obsidum numero missos apud in servitute et catenis tenuissent; neque id, quod fecerit de oppugnatione castrorum, aut iudicio aut voluntate sua fecisse, sed coactu civitatis, suaque esse eiusmodi imperia, ut non minus haberet iuris in se multitudo quam ipse in multitudinem."}, {"seq": 101, "river": "Rhine", "sentence": "5:29 In opposition to those things, Titurius exclaimed, \"That they would do this too late, when greater forces of the enemy, after a junction with the Germans, should have assembled; or when some disaster had been received in the neighboring winter-quarters; that the opportunity for deliberating was short; that he believed that Caesar had set forth into Italy, as the Carnutes would not otherwise have taken the measure of slaying Tasgetius, nor would the Eburones, if he had been present, have come to the camp with so great defiance of us; that he did not regard the enemy, but the fact, as the authority; that the Rhine was near; that the death of Ariovistus and our previous victories were subjects of great indignation to the Germans; that Gaul was inflamed, that after having received so many defeats she was reduced under the sway of the Roman people, her pristine glory in military matters being extinguished.\" Lastly, \"who would persuade himself of this, that Ambiorix had resorted to a design of that nature without sure grounds?"}, {"seq": 102, "river": "Rhine", "sentence": "When permission was granted, they recount the same things which Ambiorix had related to Titurius, namely, \"that all Gaul was in arms, that the Germans had passed the Rhine, that the winter-quarters of Caesar and of the others were attacked.\" They report in addition also, about the death of Sabinus."}, {"seq": 103, "river": "Rhine", "sentence": "5:55 But the Triviri and Indutiomarus let no part of the entire winter pass without sending embassadors across the Rhine, importuning the states, promising money, and asserting that, as a large portion of our army had been cut off, a much smaller portion remained."}, {"seq": 104, "river": "Rhine", "sentence": "However, none of the German States could be induced to cross the Rhine, since \"they had twice essayed it,\" they said, \"in the war with Ariovistus and in the passage of the Tenchtheri there; that fortune was not to be tempted any more.\" Indutiomarus disappointed in this expectation, nevertheless began to raise troops, and discipline them, and procure horses from the neighboring people, and allure to him by great rewards the outlaws and convicts throughout Gaul."}, {"seq": 105, "river": "Rhine", "sentence": "Caesar, on being informed of their acts, since he saw that war was being prepared on all sides, that the Nervii, Aduatuci, and Menapii, with the addition of all the Germans on this side of the Rhine were under arms, that the Senones did not assemble according to his command, and were concerting measures with the Carnutes and the neighboring states, that the Germans were importuned by the Treviri in frequent embassies, thought that he ought to take measures for the war earlier [than usual]."}, {"seq": 106, "river": "Rhine", "sentence": "Ho thought that these auxiliaries ought to be detached from him before he provoked him to war; lest he, despairing of safety, should either proceed to conceal himself in the territories of the Menapii, or should be driven to coalesce with the Germans beyond the Rhine."}, {"seq": 107, "river": "Rhine", "sentence": "6:9 Caesar, after he came from the territories of the Menapii into those of the Treviri, resolved for two reasons to cross the Rhine; one of which was, because they had sent assistance to the Treviri against him; the other, that Ambiorix might not have a retreat among them."}, {"seq": 108, "river": "Rhine", "sentence": "6:24 And there was formerly a time when the Gauls excelled the Germans in prowess, and waged war on them offensively, and, on account of the great number of their people and the insufficiency of their land, sent colonies over the Rhine."}, {"seq": 109, "river": "Rhine", "sentence": "Volcatius Tullus, a young man; he himself, when the corn began to ripen, having set forth for the war with Ambiorix (through the forest Arduenna, which is the largest of all Gaul, and reaches from the banks of the Rhine and the frontiers of the Treviri to those of the Nervii, and extends over more than 500 miles), he sends forward L."}, {"seq": 110, "river": "Rhine", "sentence": "6:32 The Segui and Condrusi, of the nation and number of the Germans, and who are between the Eburones and the Treviri, sent embassadors to Caesar to entreat that he would not regard them in the number of his enemies, nor consider that the cause of all the Germans on this side the Rhine was one and the same; that they had formed no plans of war, and had sent no auxiliaries to Ambiorix."}, {"seq": 111, "river": "Sambre", "sentence": "Trebonius with a like number of legions to lay waste that district which lies contiguous to the Aduatuci; he himself determines to go with the remaining three to the river Sambre, which flows into the Meuse, and to the most remote parts of Arduenna, whither he heard that Ambiorix had gone with a few horse."}, {"seq": 112, "river": "Rhine", "sentence": "The report extends beyond the Rhine to the Germans that the Eburones are being pillaged, and that all were without distinction invited to the plunder."}, {"seq": 113, "river": "Rhine", "sentence": "The Sigambri, who are nearest to the Rhine, by whom, we have mentioned above, the Tenchtheri and Usipetes were received after their retreat, collect 2,000 horse; they cross the Rhine in ships and barks thirty miles below that place where the bridge was entire and the garrison left by Caesar; they arrive at the frontiers of the Eburones, surprise many who were scattered in flight, and get possession of a large amount of cattle, of which barbarians are extremely covetous."}, {"seq": 114, "river": "Rhine", "sentence": "6:41 The Germans, despairing of taking the camp by storm, because they saw that our men had taken up their position on the fortifications, retreated beyond the Rhine with that plunder which they had deposited in the woods."}, {"seq": 115, "river": "Rhine", "sentence": "Of all which events, it seemed the most surprising, that the Germans, who had crossed the Rhine with this object, that they might plunder the territories of Ambiorix, being led to the camp of the Romans, rendered Ambiorix a most acceptable service."}, {"seq": 116, "river": "Loire", "sentence": "When they came to the river Loire, which separates the Bituriges from the Aedui, they delayed a few days there, and, not daring to pass the river, return home, and send back word to the lieutenants that they had returned through fear of the treachery of the Bituriges, who, they ascertained, had formed this design, that if the Aedui should cross the river, the Bituriges on the one side, and the Arverni on the other, should surround them."}, {"seq": 117, "river": "Loire", "sentence": "Caesar arrived here in two days; after pitching his camp before the town, being prevented by the time of the day, he defers the attack to the next day, and orders his soldiers to prepare whatever was necessary for that enterprise; and as a bridge over the Loire connected the town of Genabum with the opposite bank, fearing lest the inhabitants should escape by night from the town, he orders two legions to keep watch under arms."}, {"seq": 118, "river": "Loire", "sentence": "He pillages and burns the town, gives the booty to the soldiers, then leads his army over the Loire, and marches into the territories of the Bituriges."}, {"seq": 119, "river": "Allier", "sentence": "7:34 Having pronounced this decree between [the contending parties], he exhorted the Aedui to bury in oblivion their disputes and dissensions, and, laying aside all these things, devote themselves to the war, and expect from him, on the conquest of Gaul, those rewards which they should have earned, and send speedily to him all their cavalry and ten thousand infantry, which he might place in different garrisons to protect his convoys of provisions, and then divided his army into two parts: he gave Labienus four legions to lead into the country of the Senones and Parisii; and led in person six into the country of the Arverni, in the direction of the town of Gergovia, along the banks of the Allier."}, {"seq": 120, "river": "Allier", "sentence": "Vercingetorix, on learning this circumstance, broke down all the bridges over the river and began to march on the other bank of the Allier."}, {"seq": 121, "river": "Allier", "sentence": "7:35 When each army was in sight of the other, and was pitching their camp almost opposite that of the enemy, scouts being distributed in every quarter, lest the Romans should build a bridge and bring over their troops; it was to Caesar a matter attended with great difficulties, lest he should be hindered from passing the river during the greater part of the summer, as the Allier can not generally be forded before the autumn."}, {"seq": 122, "river": "Allier", "sentence": "The enemy not even then pursuing us, on the third day he repaired the bridge over the river Allier, and led over his whole army."}, {"seq": 123, "river": "Loire", "sentence": "7:55 Noviodunum was a town of the Aedui, advantageously situated on the banks of the Loire."}, {"seq": 124, "river": "Loire", "sentence": "Therefore, having put to the sword the garrison of Noviodunum, and those who had assembled there for the purpose of trading or were on their march, they divided the money and horses among themselves; they took care that the hostages of the [different] states should be brought to Bibracte, to the chief magistrate; they burned the town to prevent its being of any service to the Romans, as they were of opinion that they could not hold it; they carried away in their vessels whatever corn they could in the hurry, they destroyed the remainder, by [throwing it] into the river or setting it on fire, they themselves began to collect forces from the neighboring country, to place guards and garrisons in different positions along the banks of the Loire, and to display the cavalry on all sides to strike terror into the Romans, [to try] if they could cut them off from a supply of provisions."}, {"seq": 125, "river": "Loire", "sentence": "In which expectation they were much aided, from the circumstance that the Loire had swollen to such a degree from the melting of the snows, that it did not seem capable of being forded at all."}, {"seq": 126, "river": "Loire", "sentence": "Therefore, having made very long marches by day and night, he came to the river Loire, contrary to the expectation of all; and having by means of the cavalry, found out a ford, suitable enough considering the emergency, of such depth that their arms and shoulders could be above water for supporting their accoutrements, he dispersed his cavalry in such a manner as to break the force of the current, and having confounded the enemy at the first sight, led his army across the river in safety; and finding corn and cattle in the fields, after refreshing his army with them, he determined to march into the country of the Senones."}, {"seq": 127, "river": "Seine", "sentence": "7:57 While these things are being done by Caesar, Labienus, leaving at Agendicum the recruits who had lately arrived from Italy, to guard the baggage, marches with four legions to Lutetia (which is a town of the Parisii, situated on an island on the river Seine), whose arrival being discovered by the enemy, numerous forces arrived from the neighboring states."}, {"seq": 128, "river": "Seine", "sentence": "He, when he observed that there was a large marsh which communicated with the Seine, and rendered all that country impassable, encamped there, and determined to prevent our troops from passing it."}, {"seq": 129, "river": "Seine", "sentence": "This is a town of the Senones, situated on an island in the Seine, as we have just before observed of Lutetia."}, {"seq": 130, "river": "Seine", "sentence": "The enemy, on learning the circumstance from those who had escaped from Melodunum, set fire to Lutetia, and order the bridges of that town to be broken down: they themselves set out from the marsh, and take their position on the banks of the Seine, over against Lutetia and opposite the camp of Labienus."}, {"seq": 131, "river": "Loire", "sentence": "7:59 Caesar was now reported to have departed from Gergovia; intelligence was likewise brought to them concerning the revolt of the Aedui, and a successful rising in Gaul; and that Caesar, having been prevented from prosecuting his journey and crossing the Loire, and having been compelled by the want of corn, had marched hastily to the province."}, {"seq": 132, "river": "Rhine", "sentence": "The Allobroges, placing guards along the course of the Rhine, defend their frontiers with great vigilance and energy."}, {"seq": 133, "river": "Rhine", "sentence": "Caesar, as he perceived that the enemy were superior in cavalry, and he himself could receive no aid from the Province or Italy, while all communication was cut off, sends across the Rhine into Germany to those states which he had subdued in the preceding campaigns, and summons from them cavalry and the light-armed infantry, who were accustomed to engage among them."}, {"seq": 134, "river": "Saone", "sentence": "He stations Quintus Tullius Cicero, and Publius Sulpicius among the Aedui at Cabillo and Matisco on the Saone, to procure supplies of corn."}, {"seq": 135, "river": "Saone", "sentence": "Upon this intelligence, though he had not remained more than eighteen days in winter quarters, he draws the fourteenth and sixth legion out of quarters on the Saone, where he had posted them as mentioned in a former Commentary, to procure supplies of corn."}, {"seq": 136, "river": "Rhine", "sentence": "In one of these contests the Germans, whom Caesar had brought over the Rhine, to fight, intermixed with the horse, having resolutely crossed the marsh, and slain the few who made resistance, and boldly pursued the rest, so terrified them, that not only those who were attacked hand to hand, or wounded at a distance, but even those who were stationed at a greater distance to support them, fled disgracefully; and being often beaten from the rising grounds, did not stop till they had retired into their camp, or some, impelled by fear, had fled further."}, {"seq": 137, "river": "Loire", "sentence": "Nor did he think that he should be sufficiently secure from danger, unless he led his army across the Loire, which was too deep a river to pass except by a bridge."}];
  const riverCoords = {"Seine": [48.85, 2.35], "Garonne": [44.85, -0.58], "Loire": [47.5, 0.3], "Rhine": [48.0, 7.9], "Rhone": [44.5, 4.8], "Marne": [49.0, 3.5], "Saone": [46.5, 4.8], "Allier": [46.5, 3.5], "Aisne": [49.3, 4.0], "Doubs": [47.0, 6.3], "Sambre": [50.2, 4.1]};
  var map = L.map('map').setView([46.5, 2.0], 5);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {maxZoom:19, attribution:'&copy; OpenStreetMap contributors'}).addTo(map);
  var markers = {};
  for (const river in riverCoords) {
    const coord = riverCoords[river];
    const marker = L.marker(coord).addTo(map).bindPopup(river);
    markers[river] = marker;
  }
  const infoDiv = document.getElementById('info');
  const itemsDiv = document.getElementById('items');
  let selectedDiv = null;
  function updateMapSize() {
    map.invalidateSize();
  }
  references.forEach(ref => {
    const div = document.createElement('div');
    div.className = 'ref-item';
    div.textContent = ref.seq + '. ' + ref.river;
    div.addEventListener('click', () => {
      if (selectedDiv) selectedDiv.classList.remove('selected');
      div.classList.add('selected');
      selectedDiv = div;
      const marker = markers[ref.river];
      if (marker) {
        map.setView(marker.getLatLng(), 7);
        marker.openPopup();
      }
      infoDiv.innerHTML = '<strong>Sequence:</strong> ' + ref.seq + '<br><strong>River:</strong> ' + ref.river + '<br><strong>Sentence:</strong> ' + ref.sentence;
      setTimeout(updateMapSize, 20);
    });
    itemsDiv.appendChild(div);
  });
</script>
