<title id="title">An illustrated conker autumn</title><desc id="desc">Three children in grey and royal-blue school knitwear, white collars and grey shorts or skirt, with black shoes. Two play conkers in a leaf-strewn schoolyard while another collects. An imagined scene, not a photograph of Buckland.</desc>
