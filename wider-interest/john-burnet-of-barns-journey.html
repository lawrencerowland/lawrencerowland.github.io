function colourForDay(day) {
    let hash = 0;
    for (let i = 0; i < day.length; i++) {
        hash = day.charCodeAt(i) + ((hash << 5) - hash);
    }
    const r = 80 + (hash & 63);
    const g = 80 + ((hash >> 6) & 63);
    const b = 80 + ((hash >> 12) & 63);
    return `rgb(${r},${g},${b})`;
}

// Convert compact OS grid ref (e.g., "NT240390") to OsGridRef instance
function parseOSGrid(grid) {
    const letters = grid.slice(0, 2);
    const digits = grid.slice(2);
    const half = digits.length / 2;
    const e = digits.slice(0, half);
    const n = digits.slice(half);
    return OsGridRef.parse(`${letters} ${e} ${n}`);
}

const map = L.map('map').setView([55.5, -3.5], 7);

L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: '&copy; OpenStreetMap contributors',
    maxZoom: 19
}).addTo(map);

const dayGroups = {};
const legendColours = {};
let allBounds = L.latLngBounds([]);

legs.forEach(leg => {
    try {
        const fromOS = parseOSGrid(leg.from_grid);
        const toOS = parseOSGrid(leg.to_grid);
        const fromWGS = fromOS.toLatLon().toWGS84();
        const toWGS = toOS.toLatLon().toWGS84();
        const points = [[fromWGS.lat, fromWGS.lon], [toWGS.lat, toWGS.lon]];
        const colour = colourForDay(leg.day);

        if (!dayGroups[leg.day]) {
            dayGroups[leg.day] = L.featureGroup();
            legendColours[leg.day] = colour;
        }

        const poly = L.polyline(points, {
            color: colour,
            weight: 4,
            opacity: 0.8
        }).bindPopup(`<b>${leg.day}</b><br>${leg.from_name} &rarr; ${leg.to_name}<br>${leg.km} km`);
        dayGroups[leg.day].addLayer(poly);

        const startMarker = L.circleMarker(points[0], { radius: 4, color: colour });
        const endMarker = L.circleMarker(points[1], { radius: 4, color: colour });
        dayGroups[leg.day].addLayer(startMarker);
        dayGroups[leg.day].addLayer(endMarker);

        allBounds.extend(points);
    } catch(err) {
        console.warn('Failed on', leg, err);
    }
});

const overlayLayers = {};
Object.keys(dayGroups).forEach(day => {
    dayGroups[day].addTo(map);
    overlayLayers[day] = dayGroups[day];
});
L.control.layers(null, overlayLayers, { collapsed: false, position: 'topright' }).addTo(map);

map.fitBounds(allBounds);

// Legend block
const legend = L.control({ position: 'bottomright' });
legend.onAdd = function(map) {
    const div = L.DomUtil.create('div', 'legend');
    let html = '<b>Day colour key</b><br>';
    Object.entries(legendColours).forEach(([day, colour]) => {
        html += `<span style="background:${colour}"></span>${day}<br>`;
    });
    div.innerHTML = html;
    return div;
};
legend.addTo(map);
