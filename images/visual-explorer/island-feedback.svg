          <text x="305" y="137" text-anchor="middle" class="node-symbol" style="fill:rgb(32, 101, 93);font-family:&quot;Libre Baskerville&quot;, Georgia, serif;font-size:32px;font-style:italic;font-weight:400;opacity:1;paint-order:normal;stroke:none;stroke-width:1px;text-anchor:middle">f</text><text x="305" y="167" text-anchor="middle" class="node-title" style="fill:rgb(32, 60, 58);font-family:&quot;DM Sans&quot;, Inter, system-ui, sans-serif;font-size:16px;font-style:normal;font-weight:600;opacity:1;paint-order:normal;stroke:none;stroke-width:1px;text-anchor:middle">Landing</text><text x="305" y="189" text-anchor="middle" class="node-title" style="fill:rgb(32, 60, 58);font-family:&quot;DM Sans&quot;, Inter, system-ui, sans-serif;font-size:16px;font-style:normal;font-weight:600;opacity:1;paint-order:normal;stroke:none;stroke-width:1px;text-anchor:middle">coordinator</text><text id="f-policy-label" x="305" y="221" text-anchor="middle" class="node-policy" style="fill:rgb(96, 113, 106);font-family:&quot;DM Sans&quot;, Inter, system-ui, sans-serif;font-size:12px;font-style:normal;font-weight:400;opacity:1;paint-order:normal;stroke:none;stroke-width:1px;text-anchor:middle">Shore path allowed</text>
          <text x="675" y="137" text-anchor="middle" class="node-symbol" style="fill:rgb(32, 101, 93);font-family:&quot;Libre Baskerville&quot;, Georgia, serif;font-size:32px;font-style:italic;font-weight:400;opacity:1;paint-order:normal;stroke:none;stroke-width:1px;text-anchor:middle">g</text><text x="675" y="167" text-anchor="middle" class="node-title" style="fill:rgb(32, 60, 58);font-family:&quot;DM Sans&quot;, Inter, system-ui, sans-serif;font-size:16px;font-style:normal;font-weight:600;opacity:1;paint-order:normal;stroke:none;stroke-width:1px;text-anchor:middle">Delivery</text><text x="675" y="189" text-anchor="middle" class="node-title" style="fill:rgb(32, 60, 58);font-family:&quot;DM Sans&quot;, Inter, system-ui, sans-serif;font-size:16px;font-style:normal;font-weight:600;opacity:1;paint-order:normal;stroke:none;stroke-width:1px;text-anchor:middle">coordinator</text><text id="g-policy-label" x="675" y="221" text-anchor="middle" class="node-policy" style="fill:rgb(96, 113, 106);font-family:&quot;DM Sans&quot;, Inter, system-ui, sans-serif;font-size:12px;font-style:normal;font-weight:400;opacity:1;paint-order:normal;stroke:none;stroke-width:1px;text-anchor:middle">Fixed pallet</text>
          <text x="48" y="88" class="port" style="fill:rgb(32, 60, 58);font-family:&quot;DM Sans&quot;, Inter, system-ui, sans-serif;font-size:17px;font-style:normal;font-weight:700;opacity:1;paint-order:normal;stroke:none;stroke-width:1px;text-anchor:start">A⁺</text><text x="92" y="87" class="port-detail" style="fill:rgb(96, 113, 106);font-family:&quot;DM Sans&quot;, Inter, system-ui, sans-serif;font-size:11px;font-style:normal;font-weight:400;opacity:1;paint-order:normal;stroke:none;stroke-width:1px;text-anchor:start">access report →</text><text x="48" y="217" class="port" style="fill:rgb(32, 60, 58);font-family:&quot;DM Sans&quot;, Inter, system-ui, sans-serif;font-size:17px;font-style:normal;font-weight:700;opacity:1;paint-order:normal;stroke:none;stroke-width:1px;text-anchor:start">A⁻</text><text x="92" y="216" class="port-detail" style="fill:rgb(96, 113, 106);font-family:&quot;DM Sans&quot;, Inter, system-ui, sans-serif;font-size:11px;font-style:normal;font-weight:400;opacity:1;paint-order:normal;stroke:none;stroke-width:1px;text-anchor:start">← survey question</text>
