<svg xmlns="http://www.w3.org/2000/svg" id="full-diagram" viewBox="0 0 980 340" role="img" aria-labelledby="full-svg-title full-svg-description" width="980" height="340" style="background:#fcfaf4">
          <rect x="0" y="0" width="980" height="340" fill="#fcfaf4" /><title id="full-svg-title" style="fill:rgb(0, 0, 0);font-family:&quot;DM Sans&quot;, Inter, system-ui, sans-serif;font-size:16px;font-style:normal;font-weight:400;opacity:1;paint-order:normal;stroke:none;stroke-width:1px;text-anchor:start">Signed feedback between landing and delivery</title><desc id="full-svg-description" style="fill:rgb(0, 0, 0);font-family:&quot;DM Sans&quot;, Inter, system-ui, sans-serif;font-size:16px;font-style:normal;font-weight:400;opacity:1;paint-order:normal;stroke:none;stroke-width:1px;text-anchor:start">The landing coordinator f receives A plus reports and B minus requests; it returns A minus survey questions or B plus offers. The delivery coordinator g receives B plus offers and C minus delivery requests; it returns B minus questions or C plus plans. The two B wires cross without joining.</desc>
          <defs style="fill:rgb(0, 0, 0);font-family:&quot;DM Sans&quot;, Inter, system-ui, sans-serif;font-size:16px;font-style:normal;font-weight:400;opacity:1;paint-order:normal;stroke:none;stroke-width:1px;text-anchor:start"><marker id="arrow-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse" style="fill:rgb(0, 0, 0);font-family:&quot;DM Sans&quot;, Inter, system-ui, sans-serif;font-size:16px;font-style:normal;font-weight:400;opacity:1;paint-order:normal;stroke:none;stroke-width:1px;text-anchor:start"><path d="M 0 0 L 10 5 L 0 10 z" fill="#a9b9aa" style="fill:rgb(169, 185, 170);font-family:&quot;DM Sans&quot;, Inter, system-ui, sans-serif;font-size:16px;font-style:normal;font-weight:400;opacity:1;paint-order:normal;stroke:none;stroke-width:1px;text-anchor:start" /></marker><marker id="arrow-active" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse" style="fill:rgb(0, 0, 0);font-family:&quot;DM Sans&quot;, Inter, system-ui, sans-serif;font-size:16px;font-style:normal;font-weight:400;opacity:1;paint-order:normal;stroke:none;stroke-width:1px;text-anchor:start"><path d="M 0 0 L 10 5 L 0 10 z" fill="#bc762c" style="fill:rgb(188, 118, 44);font-family:&quot;DM Sans&quot;, Inter, system-ui, sans-serif;font-size:16px;font-style:normal;font-weight:400;opacity:1;paint-order:normal;stroke:none;stroke-width:1px;text-anchor:start" /></marker></defs>
          <text x="85" y="35" text-anchor="middle" class="interface-label" style="fill:rgb(96, 113, 106);font-family:&quot;DM Sans&quot;, Inter, system-ui, sans-serif;font-size:11px;font-style:normal;font-weight:700;opacity:1;paint-order:normal;stroke:none;stroke-width:1px;text-anchor:middle">A · INSPECTOR</text><text x="490" y="35" text-anchor="middle" class="interface-label" style="fill:rgb(96, 113, 106);font-family:&quot;DM Sans&quot;, Inter, system-ui, sans-serif;font-size:11px;font-style:normal;font-weight:700;opacity:1;paint-order:normal;stroke:none;stroke-width:1px;text-anchor:middle">B · OFFERS → / ← REQUESTS</text><text x="895" y="35" text-anchor="middle" class="interface-label" style="fill:rgb(96, 113, 106);font-family:&quot;DM Sans&quot;, Inter, system-ui, sans-serif;font-size:11px;font-style:normal;font-weight:700;opacity:1;paint-order:normal;stroke:none;stroke-width:1px;text-anchor:middle">C · PROJECT</text>
