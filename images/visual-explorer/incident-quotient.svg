<svg xmlns="http://www.w3.org/2000/svg" id="diagram" viewBox="0 0 900 230" role="img" aria-labelledby="diagram-title diagram-description" width="900" height="230" style="font-family:system-ui,-apple-system,sans-serif;font-size:16px;background:white"><rect x="0" y="0" width="900" height="230" fill="#ffffff" /><title id="diagram-title">Incidents and their quotient classes</title><desc id="diagram-description">Each incident maps to the class listed in the table below. The links are chosen identifications.</desc><text x="12" y="20">Incidents</text><path d="M142.5,65 Q245,25 347.5,65" fill="none" stroke="#63758d" stroke-width="2" /><path d="M347.5,65 Q450,18 552.5,65" fill="none" stroke="#63758d" stroke-width="2" /><line x1="142.5" y1="80" x2="245" y2="165" stroke="#9baec7" stroke-dasharray="5 4" /><circle cx="142.5" cy="65" r="17" fill="hsl(0 50% 85%)" stroke="#354c67" /><text x="142.5" y="70" text-anchor="middle">I1</text><line x1="347.5" y1="80" x2="245" y2="165" stroke="#9baec7" stroke-dasharray="5 4" /><circle cx="347.5" cy="65" r="17" fill="hsl(0 50% 85%)" stroke="#354c67" /><text x="347.5" y="70" text-anchor="middle">I2</text><line x1="552.5" y1="80" x2="245" y2="165" stroke="#9baec7" stroke-dasharray="5 4" /><circle cx="552.5" cy="65" r="17" fill="hsl(0 50% 85%)" stroke="#354c67" /><text x="552.5" y="70" text-anchor="middle">I3</text><line x1="757.5" y1="80" x2="655" y2="165" stroke="#9baec7" stroke-dasharray="5 4" /><circle cx="757.5" cy="65" r="17" fill="hsl(67 50% 85%)" stroke="#354c67" /><text x="757.5" y="70" text-anchor="middle">I4</text><circle cx="245" cy="180" r="22" fill="hsl(0 50% 85%)" stroke="#354c67" /><text x="245" y="185" text-anchor="middle">C1</text><circle cx="655" cy="180" r="22" fill="hsl(67 50% 85%)" stroke="#354c67" /><text x="655" y="185" text-anchor="middle">C2</text></svg>