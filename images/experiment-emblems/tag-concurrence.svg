<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" role="img" aria-labelledby="title description">
  <title id="title">Tag Concurrence Graph</title>
  <desc id="description">Two overlapping constellations connect repeated concepts, with one central theme shared across the clusters.</desc>
