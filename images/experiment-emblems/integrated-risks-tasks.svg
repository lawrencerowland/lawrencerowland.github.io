<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" role="img" aria-labelledby="title description">
  <title id="title">Integrated risks &amp; tasks</title>
  <desc id="description">Two distinct process routes converge on one shared resource gate before diverging again.</desc>
