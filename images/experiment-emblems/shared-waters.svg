<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" role="img" aria-labelledby="title description">
  <title id="title">Shared waters: open systems</title>
  <desc id="description">Three separate system boundaries meet through explicit shared ports, while each keeps its internal structure.</desc>
