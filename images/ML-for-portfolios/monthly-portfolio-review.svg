<svg xmlns="http://www.w3.org/2000/svg" width="760" height="380" viewBox="0 0 760 380" role="img" aria-labelledby="title desc">
<title id="title">The monthly portfolio review: decide, learn, decide again</title>
<desc id="desc">At this review, state S zero informs decision x zero. Progress and new information W one lead into next month's updated state S one and decision x one. This illustrates the 2020 note's question, not the behaviour of its notebooks.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#48665b" stroke-width="1.5"/></marker></defs>
<rect width="760" height="380" rx="14" fill="#f3f1e8"/>
<g font-family="Arial, Helvetica, sans-serif" fill="#233d34">
<text x="32" y="42" font-size="16" letter-spacing="2">DECEMBER 2020 · A QUESTION ABOUT DECISIONS</text>
<text x="32" y="78" font-size="29" font-weight="700">Decide. Learn. Decide again.</text>
<rect x="32" y="118" width="220" height="156" rx="10" fill="#ffffff" stroke="#a3b2a3"/>
<text x="52" y="151" font-size="18" font-weight="700">THIS REVIEW</text>
<text x="52" y="190" font-size="24">State S₀</text>
<text x="52" y="216" font-size="17">What do we know?</text>
<text x="52" y="250" font-size="22" font-weight="700">Choose x₀</text>
<path d="M258 200H293M468 200H501" fill="none" stroke="#48665b" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="302" y="146" width="155" height="106" rx="15" fill="#dfe8d5"/>
<text x="380" y="173" text-anchor="middle" font-size="19">Progress +</text>
<text x="380" y="198" text-anchor="middle" font-size="19">information</text>
<text x="380" y="231" text-anchor="middle" font-size="25" font-weight="700">W₁</text>
<rect x="508" y="118" width="220" height="156" rx="10" fill="#ffffff" stroke="#a3b2a3"/>
<text x="528" y="151" font-size="18" font-weight="700">NEXT REVIEW</text>
<text x="528" y="190" font-size="24">Updated state S₁</text>
<text x="528" y="216" font-size="17">What changed?</text>
<text x="528" y="250" font-size="22" font-weight="700">Choose x₁</text>
<text x="32" y="319" font-size="20" font-weight="700">Move the work forward — or find out more first?</text>
<text x="32" y="349" font-size="15" fill="#566357">Reading diagram made in 2026 from the original note; no policy is computed.</text>
</g></svg>