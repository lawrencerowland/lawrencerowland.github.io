<title id="title">A brick wall and timber roof under construction</title>
<desc id="desc">An unfinished brick building supports exposed timber roof trusses, with tiles covering part of the far roof. A scaffold and ladder provide access; a brick pallet, mortar tub and masonry tools occupy the foreground.</desc>
