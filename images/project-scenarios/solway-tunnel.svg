<title id="title">A tunnel being driven below a coastal channel</title>
<desc id="desc">A cutaway coastal landscape reveals the seabed beneath a stretch of sea between grassy shores. A tunnel runs through the ground below, with concrete lining, a rail wagon and a circular boring shield at the excavation face.</desc>
