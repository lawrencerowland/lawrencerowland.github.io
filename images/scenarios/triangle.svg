<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" role="img" aria-labelledby="title"><title id="title">A control centre on a triangular site with crossing infrastructure</title><rect width="640" height="400" rx="18" fill="#f3f0e6"/><g stroke="#264e4b" stroke-width="4" stroke-linejoin="round"><path d="M100 315 320 95 540 315Z" fill="#dfddba"/><path d="M55 270Q280 205 585 240" stroke="#67a7bd" stroke-width="24" fill="none"/><path d="M110 340 545 120" stroke="#c0aaa0" stroke-width="20"/><path d="M85 160 570 280" stroke="#264e4b" stroke-width="8"/><rect x="288" y="225" width="75" height="55" fill="#f8d68c"/><text x="40" y="55" fill="#264e4b" stroke="none" font-family="system-ui,sans-serif" font-size="21">One awkward site. Several teams.</text><text x="400" y="150" fill="#264e4b" stroke="none" font-family="system-ui,sans-serif" font-size="21">Road</text><text x="45" y="215" fill="#264e4b" stroke="none" font-family="system-ui,sans-serif" font-size="21">Canal</text><text x="405" y="312" fill="#264e4b" stroke="none" font-family="system-ui,sans-serif" font-size="21">Railway</text><text x="205" y="373" fill="#264e4b" stroke="none" font-family="system-ui,sans-serif" font-size="21">Where can the centre fit?</text></g></svg>