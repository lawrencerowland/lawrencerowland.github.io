<svg xmlns="http://www.w3.org/2000/svg" width="640" height="400" viewBox="0 0 640 400" role="img" aria-labelledby="title desc">
<title id="title">Question, method, check</title><desc id="desc">Three paper cards connected by arrows. A project question leads to a model, then a check; a return arrow brings the learning back to the question.</desc>
