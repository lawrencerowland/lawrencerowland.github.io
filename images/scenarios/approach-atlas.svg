<rect width="640" height="400" rx="12" fill="#e5ece6"/><rect width="640" height="400" rx="12" fill="url(#grid)"/>
<g fill="none" stroke="#086d70" stroke-width="2.5" marker-end="url(#arrow)"><path d="M192 187h25"/><path d="M408 187h25"/><path d="M524 276v49H113v-47"/></g>
<g fill="#fffefa" stroke="#a7b9af" stroke-width="1.4"><rect x="34" y="90" width="165" height="188" rx="8"/><rect x="237" y="90" width="165" height="188" rx="8"/><rect x="440" y="90" width="165" height="188" rx="8"/></g>
<g font-family="system-ui,sans-serif" fill="#52646c" font-size="11" letter-spacing="2"><text x="53" y="119">01 / QUESTION</text><text x="256" y="119">02 / METHOD</text><text x="459" y="119">03 / CHECK</text></g>
<g fill="none" stroke="#086d70" stroke-width="2.5"><path d="M66 206h102M81 205v-42h35v42m16 0v-65h23v65"/><path d="M281 160l65 37m-65 25 65-25m-65-37v62"/><circle cx="281" cy="160" r="10" fill="#e5ece6"/><circle cx="281" cy="222" r="10" fill="#e5ece6"/><rect x="336" y="187" width="20" height="20" fill="#e5ece6"/><path d="M476 168l10 10 19-24m-29 53 10 10 19-24m12-23h53m-53 38h53"/></g>
<g font-family="Georgia,serif" fill="#172c35" font-size="19"><text x="53" y="252">What must fit?</text><text x="256" y="252">What relates?</text><text x="459" y="252">What holds?</text></g>
<text x="320" y="351" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" fill="#52646c">Bring the learning back to the project.</text>
