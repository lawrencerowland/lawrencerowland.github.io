    <rect x="291" y="170" width="74" height="24" rx="5"/>
    <rect x="291" y="299" width="74" height="24" rx="5"/>
  </g>
  <g fill="#8b6b39" font-family="system-ui,sans-serif" font-size="12" text-anchor="middle">
