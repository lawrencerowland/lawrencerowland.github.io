    <path d="M241 197C257 197 253 135 275 135"/>
    <path d="M241 197C257 197 253 264 275 264"/>
    <path d="M380 135H395"/>
    <path d="M380 264H395"/>
    <path d="M500 135C517 135 499 183 517 190"/>
    <path d="M500 264C517 264 499 211 517 204"/>
  </g>
  <g fill="#fffdf6" stroke="#8da091" stroke-width="1.8">
    <rect x="18" y="170" width="106" height="54" rx="8"/>
    <rect x="145" y="170" width="96" height="54" rx="8"/>
    <rect x="276" y="108" width="104" height="54" rx="8"/>
    <rect x="397" y="108" width="103" height="54" rx="8"/>
    <rect x="276" y="237" width="104" height="54" rx="8"/>
    <rect x="397" y="237" width="103" height="54" rx="8"/>
    <rect x="519" y="170" width="105" height="54" rx="8"/>
  </g>
  <g fill="#2d4d40" font-family="system-ui,sans-serif" font-size="12.5" text-anchor="middle">
    <text x="71" y="202">Requirements</text>
    <text x="193" y="202">Design</text>
    <text x="328" y="140">Development</text>
    <text x="448" y="140">Testing</text>
    <text x="328" y="269">Documentation</text>
    <text x="448" y="269">Training</text>
    <text x="571" y="202">Deployment</text>
