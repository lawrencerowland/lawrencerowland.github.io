<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" role="img" aria-labelledby="title desc">
  <title id="title">Try protective buffer in a seven-task project</title>
  <desc id="desc">Requirements and design feed two branches: development then testing, and documentation then training. Both join at deployment. Small dashed buffer boxes suggest adjustments; no risk values or timing results are drawn.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M1 1 6 4 1 7" fill="none" stroke="#708879" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker>
  </defs>
  <rect width="640" height="400" fill="#f3f0e6"/>
  <text x="32" y="37" fill="#3f6654" font-family="system-ui,sans-serif" font-size="12" letter-spacing="2">BUFFER &amp; COMMITMENT</text>
  <text x="32" y="66" fill="#2d4d40" font-family="Georgia,serif" font-size="24">One project. Where should buffer go?</text>
  <rect x="268" y="96" width="238" height="90" rx="13" fill="#e5eade"/>
  <rect x="268" y="225" width="238" height="90" rx="13" fill="#eae5d5"/>
  <g fill="none" stroke="#708879" stroke-width="2.7" stroke-linecap="round" marker-end="url(#arrow)">
