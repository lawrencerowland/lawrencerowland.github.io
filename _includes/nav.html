{% if page.home_front_door %}<a class="pw-skip-link" href="#home-main">Skip to content</a>{% endif %}
<nav class="navbar pw-navigation" aria-label="Main navigation">
  <div class="nav-container">
    <a class="logo pw-site-brand" href="{{ '/' | relative_url }}" {% if page.url == '/' %}aria-current="page"{% endif %}><span>Lawrence Rowland</span><small>Independent project experiments</small></a>
    <button class="nav-toggle" type="button" aria-label="Open navigation" aria-expanded="false" aria-controls="main-nav-links" hidden><span>Menu</span><span class="pw-menu-icon" aria-hidden="true"></span></button>
    <ul class="nav-links" id="main-nav-links">
      <li><a href="{{ '/side-projects.html' | relative_url }}" {% if page.url == '/side-projects.html' %}class="active" aria-current="page"{% endif %}>Experiments</a></li>
      <li><a href="{{ '/library.html' | relative_url }}" {% if page.url == '/library.html' or page.url contains '/library/' or page.url == '/graphs.html' or page.url == '/Books.html' or page.url == '/gap-map.html' %}class="active" aria-current="page"{% endif %}>Library</a></li>
      <li><a href="{{ '/explore-visually.html' | relative_url }}" {% if page.url == '/explore-visually.html' %}class="active" aria-current="page"{% endif %}>Visual atlas</a></li>
      <li><a href="{{ '/wider-interest/' | relative_url }}" {% if page.url contains '/wider-interest/' %}class="active" aria-current="page"{% endif %}>Wider interest</a></li>
    </ul>
  </div>
</nav>
<script>
  document.addEventListener('DOMContentLoaded', () => {
    const nav = document.querySelector('.pw-navigation');
    if (!nav) return;
    const toggle = nav.querySelector('.nav-toggle');
    const links = nav.querySelector('.nav-links');
    const close = () => {
      links.classList.remove('show');
      toggle.setAttribute('aria-expanded', 'false');
      toggle.setAttribute('aria-label', 'Open navigation');
    };
    nav.dataset.enhanced = 'true';
    toggle.hidden = false;
    toggle.addEventListener('click', () => {
      const expanded = links.classList.toggle('show');
      toggle.setAttribute('aria-expanded', String(expanded));
      toggle.setAttribute('aria-label', expanded ? 'Close navigation' : 'Open navigation');
    });
    nav.addEventListener('keydown', event => {
      if (event.key === 'Escape' && toggle.getAttribute('aria-expanded') === 'true') {
        close(); toggle.focus();
      }
    });
    links.addEventListener('click', event => { if (event.target.closest('a')) close(); });
    window.matchMedia('(min-width: 701px)').addEventListener('change', close);
  });
</script>
