<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 460" role="img" aria-labelledby="title desc"><title id="title">Illustrative portfolio lifecycle</title><desc id="desc">Ideas can proceed through proposal, approval and delivery, or be cancelled. Fixed transition probabilities are teaching assumptions.</desc><rect width="1000" height="460" fill="#faf8f1"/><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#49685c"/></marker></defs><text x="35" y="35" font-family="system-ui,sans-serif" font-size="18" fill="#345548">A portfolio idea has several possible journeys</text><path d="M165 110H285" fill="none" stroke="#49685c" stroke-width="2.5" marker-end="url(#arrow)"/><text x="225" y="92" font-family="system-ui,sans-serif" font-size="18" fill="#233b31">0.7</text><path d="M415 110H535" fill="none" stroke="#49685c" stroke-width="2.5" marker-end="url(#arrow)"/><text x="475" y="92" font-family="system-ui,sans-serif" font-size="18" fill="#233b31">0.6</text><path d="M665 110H785" fill="none" stroke="#49685c" stroke-width="2.5" marker-end="url(#arrow)"/><text x="725" y="92" font-family="system-ui,sans-serif" font-size="18" fill="#233b31">0.9</text><path d="M100 160C100 350 300 350 535 350" fill="none" stroke="#49685c" stroke-width="2.5" marker-end="url(#arrow)"/><text x="220" y="332" font-family="system-ui,sans-serif" font-size="18" fill="#233b31">0.3</text><path d="M350 160C350 280 435 310 540 334" fill="none" stroke="#49685c" stroke-width="2.5" marker-end="url(#arrow)"/><text x="410" y="290" font-family="system-ui,sans-serif" font-size="18" fill="#233b31">0.4</text><path d="M600 160V300" fill="none" stroke="#49685c" stroke-width="2.5" marker-end="url(#arrow)"/><text x="620" y="240" font-family="system-ui,sans-serif" font-size="18" fill="#233b31">0.1</text><path d="M820 156C770 205 725 265 651 316" fill="none" stroke="#49685c" stroke-width="2.5" marker-end="url(#arrow)"/><text x="727" y="245" font-family="system-ui,sans-serif" font-size="18" fill="#233b31">0.2</text><path d="M850 160V300" fill="none" stroke="#49685c" stroke-width="2.5" marker-end="url(#arrow)"/><text x="875" y="240" font-family="system-ui,sans-serif" font-size="18" fill="#233b31">0.8</text><rect x="35" y="62" width="130" height="96" rx="24" fill="#ffffff" stroke="#49685c" stroke-width="2"/><text x="100" y="116" text-anchor="middle" font-family="system-ui,sans-serif" font-size="18" fill="#233b31">Idea</text><rect x="285" y="62" width="130" height="96" rx="24" fill="#ffffff" stroke="#49685c" stroke-width="2"/><text x="350" y="116" text-anchor="middle" font-family="system-ui,sans-serif" font-size="18" fill="#233b31">Proposal</text><rect x="535" y="62" width="130" height="96" rx="24" fill="#ffffff" stroke="#49685c" stroke-width="2"/><text x="600" y="116" text-anchor="middle" font-family="system-ui,sans-serif" font-size="18" fill="#233b31">Approved</text><rect x="785" y="62" width="130" height="96" rx="24" fill="#ffffff" stroke="#49685c" stroke-width="2"/><text x="850" y="116" text-anchor="middle" font-family="system-ui,sans-serif" font-size="18" fill="#233b31">In progress</text><rect x="535" y="302" width="130" height="96" rx="24" fill="#d9e7de" stroke="#49685c" stroke-width="2"/><text x="600" y="356" text-anchor="middle" font-family="system-ui,sans-serif" font-size="18" fill="#233b31">Cancelled</text><rect x="785" y="302" width="130" height="96" rx="24" fill="#d9e7de" stroke="#49685c" stroke-width="2"/><text x="850" y="356" text-anchor="middle" font-family="system-ui,sans-serif" font-size="18" fill="#233b31">Completed</text><text x="35" y="435" font-family="system-ui,sans-serif" font-size="16" fill="#49685c">Invented probabilities · no durations, budgets or shared-resource model</text></svg>
