name: Check foray directory

on:
  pull_request:
    paths:
      - 'project-approach-atlas/**'
      - 'gimmer-comparison/**'
      - 'tests/gimmer-comparison.test.cjs'
      - 'project-co-design/**'
      - 'tests/co-design-site.test.cjs'
      - '_data/side_projects.yml'
      - '_data/project_questions.yml'
      - '_data/worked_examples.yml'
      - 'images/scenarios/**'
      - '_includes/**'
      - '_layouts/**'
      - 'side-projects.md'
      - 'index.md'
      - 'library.md'
      - 'about_me.md'
      - 'about_the_site.md'
      - 'blog_summary.md'
      - '_config.yml'
      - 'tests/public-front-door.test.cjs'
      - 'assets/**'
      - 'tests/foray-directory.test.cjs'
      - 'all-project-apps.md'
      - 'tests/app-migration.test.cjs'
      - 'tests/fixtures/app-migration/**'
      - '.github/workflows/foray-directory-check.yml'
  push:
    branches: [master]
    paths:
      - 'project-approach-atlas/**'
      - 'gimmer-comparison/**'
      - 'tests/gimmer-comparison.test.cjs'
      - 'project-co-design/**'
      - 'tests/co-design-site.test.cjs'
      - '_data/side_projects.yml'
      - '_data/project_questions.yml'
      - '_data/worked_examples.yml'
      - 'images/scenarios/**'
      - '_includes/**'
      - '_layouts/**'
      - 'side-projects.md'
      - 'index.md'
      - 'library.md'
      - 'about_me.md'
      - 'about_the_site.md'
      - 'blog_summary.md'
      - '_config.yml'
      - 'tests/public-front-door.test.cjs'
      - 'assets/**'
      - 'tests/foray-directory.test.cjs'
      - 'all-project-apps.md'
      - 'tests/app-migration.test.cjs'
      - 'tests/fixtures/app-migration/**'
      - '.github/workflows/foray-directory-check.yml'

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - name: Check atlas preservation and interaction contracts
        run: node project-approach-atlas/tests/atlas.test.cjs
      - name: Check public front door and navigation
        run: node tests/public-front-door.test.cjs
      - name: Check nine Gimmer models and comparison contracts
        run: node tests/gimmer-comparison.test.cjs
      - name: Check directory data and filtering
        run: node tests/foray-directory.test.cjs
      - name: Check app migration loading and specialist routes
        run: node tests/app-migration.test.cjs
      - name: Check co-design routes and preserved model
        run: node tests/co-design-site.test.cjs
      - name: Check finite staged co-design model
        run: node project-co-design/docs/rail-staged-codesign/verify.mjs
      - name: Check programme studio against its independent evaluator
        run: node project-co-design/tests/programme-studio.test.mjs
      - name: Check wildlife composition against independent flat enumeration
        run: node project-co-design/docs/wildlife-codesign/oracle.mjs
      - name: Replay crossing witnesses from exported catalogues
        run: node project-co-design/docs/wildlife-codesign/export.test.cjs
      - name: Check monitoring-power interface, units and migration
        run: node project-co-design/docs/rail-power-loop/monitoring-power.test.cjs
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install the pinned co-design solver
        run: python -m pip install --no-deps -r project-co-design/docs/rail-power-loop/requirements.txt
      - name: Check finite and top module boundaries
        run: python project-co-design/docs/rail-power-loop/module_boundary_tests.py
      - name: Reproduce the package-computed monitoring-power atlas
        run: python project-co-design/docs/rail-power-loop/build_atlas.py --check
      - name: Check the power-loop witnesses by independent enumeration
        run: python project-co-design/docs/rail-power-loop/oracle.py
      - name: Build the existing Jekyll site
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site
      - name: Check the rendered directory
        run: node tests/foray-directory.test.cjs _site/side-projects.html _site/library.html
      - name: Check the rendered app migration catalogue
        run: node tests/app-migration.test.cjs _site/all-project-apps.html
      - name: Check the rendered Gimmer comparison
        run: node tests/gimmer-comparison.test.cjs _site
      - name: Check the rendered public front door and library
        run: node tests/public-front-door.test.cjs _site
      - name: Save the built site for preview
        uses: actions/upload-artifact@v4
        with:
          name: public-site-preview
          path: _site
          retention-days: 7
