permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: tools/library-apps/package-lock.json
      - name: Check repaired Library models and reproduce published apps
        working-directory: tools/library-apps
        run: |
          npm ci --ignore-scripts
          npm test
          npm run build
          git diff --exit-code -- ../../library/apps
      - name: Check agent orientation and generated directories
        run: |
          node tools/agent-orientation/generate.cjs --check
          node tests/agent-orientation.test.cjs
      - name: Check Library app preservation and legacy routes
        run: node tests/library-app-retirement.test.cjs
      - name: Check retained example and writing routes
        run: |
          node tests/hs2-route.test.cjs
          node tests/library-housekeeping.test.cjs
          node tests/library-flat-subjects.test.cjs
      - name: Check ten migrated Library examples
        run: |
          node --test tests/decision-app-migration.test.cjs
          node --test tests/schedule-app-migration.test.cjs
          node --test tests/capability-app-migration.test.cjs
          node tests/stakeholder-migration.test.cjs
          node tests/ten-library-migration.test.cjs
      - name: Check eight further migrated Library examples
        run: |
          node --test tests/eight-capability-models.test.cjs
          node --test tests/eight-schedule-models.test.cjs
          node --test tests/eight-data-models.test.cjs
          node --test tests/eight-probecrafter-model.test.cjs
          node tests/eight-library-migration.test.cjs
      - name: Check consolidation and retained board
        run: |
          node --test tests/step-one-gap-map.test.cjs tests/step-one-contract-board.test.cjs tests/step-one-graph-views.test.cjs
          node tests/step-one-library-migration.test.cjs
      - name: Check phase-two models and their Library or foray homes
        run: |
          node --test tests/phase-two-frontier.test.cjs tests/phase-two-waste.test.cjs tests/phase-two-time.test.cjs tests/phase-two-fca.test.cjs
          node tests/phase-two-library-migration.test.cjs
      - name: Check graph, evidence and state examples
        run: |
          node --test tests/phase-three-evidence.test.cjs tests/phase-three-maps.test.cjs tests/phase-three-viability.test.cjs
          node tests/phase-three-library-migration.test.cjs
      - name: Check contracts, bargaining and Solway relocation
        run: |
          node --test library/apps/project-contract-lab/tests/*.cjs library/apps/regulatory-rehearsal/tests/*.cjs
          node tests/phase-four-library-migration.test.cjs
      - name: Check causal, feedback and dependency models
        run: |
          node --test counterfactuals/tests/*.cjs library/apps/signed-feedback-lab/tests/*.cjs library/apps/project-dependency-atlas/tests/*.cjs
          node tests/phase-five-library-migration.test.cjs
      - name: Check graph transformations, scenarios and health models
        run: |
          node --test library/apps/graph-transform-workbench/tests/*.cjs library/apps/portfolio-scenario-loom/tests/*.cjs library/apps/project-health-and-benefits/tests/*.cjs
          node tests/phase-six-library-migration.test.cjs
      - name: Check dated scenarios and service-design models
        run: |
          node --test library/apps/change-coordination/tests/*.cjs library/apps/project-services-guide/guide.test.cjs
          node tests/phase-seven-library-migration.test.cjs
      - name: Check final app homes and collection closure
        run: |
          node --test tests/final-*.test.cjs
          node tests/frobenius-dsm.test.cjs
      - name: Check weighted decision sampling
        run: node tests/decision-sampling.test.cjs
      - name: Check public front door and navigation
        run: |
          node tests/public-front-door.test.cjs
          node tests/navigation-compatibility.test.cjs
      - name: Check site tree, Social Debt and all wider-interest app repairs
        run: node --test tests/site-tree.test.cjs tests/social-debt-migration.test.cjs tests/wider-history.test.cjs tests/wider-math-play.test.cjs
      - name: Check the handover pack and central bookmark routes
        run: |
          node --test tests/handover-pack.test.cjs tests/legacy-app-routes.test.cjs
          node tools/legacy-apps/generate.cjs --check
      - name: Check visual explorer catalogue and discovery
        run: node tests/visual-explorer.test.cjs
      - name: Check nine Gimmer models and comparison contracts
        run: node tests/gimmer-comparison.test.cjs
      - name: Check directory data and filtering
        run: node tests/foray-directory.test.cjs
      - name: Check app migration loading and specialist routes
        run: node tests/app-migration.test.cjs
      - name: Check co-design routes and preserved model
        run: node tests/co-design-site.test.cjs
      - name: Check finite staged co-design model
        run: node project-co-design/docs/rail-staged-codesign/verify.mjs
      - name: Check programme studio against its independent evaluator
        run: node project-co-design/tests/programme-studio.test.mjs
      - name: Check wildlife composition against independent flat enumeration
        run: node project-co-design/docs/wildlife-codesign/oracle.mjs
      - name: Replay crossing witnesses from exported catalogues
        run: node project-co-design/docs/wildlife-codesign/export.test.cjs
      - name: Check monitoring-power interface, units and migration
        run: node project-co-design/docs/rail-power-loop/monitoring-power.test.cjs
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install the pinned co-design solver
        run: python -m pip install --no-deps -r project-co-design/docs/rail-power-loop/requirements.txt
      - name: Check finite and top module boundaries
        run: python project-co-design/docs/rail-power-loop/module_boundary_tests.py
      - name: Reproduce the package-computed monitoring-power atlas
        run: python project-co-design/docs/rail-power-loop/build_atlas.py --check
      - name: Check the power-loop witnesses by independent enumeration
        run: python project-co-design/docs/rail-power-loop/oracle.py
      - name: Build the existing Jekyll site
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site
      - name: Check the rendered Library and writing routes
        run: |
          node tests/library-housekeeping.test.cjs _site
          node tests/library-flat-subjects.test.cjs _site
      - name: Check the rendered directory
        run: node tests/foray-directory.test.cjs _site/side-projects.html _site/library.html
      - name: Check the rendered app migration catalogue
        run: node tests/app-migration.test.cjs _site/all-project-apps.html
      - name: Check the rendered Gimmer comparison
        run: node tests/gimmer-comparison.test.cjs _site
      - name: Check the rendered public front door and library
        run: |
          node tests/public-front-door.test.cjs _site
          node tests/navigation-compatibility.test.cjs _site
          node tests/site-tree.test.cjs _site
          node tests/wider-history.test.cjs _site
          node tests/social-debt-migration.test.cjs _site
          node tests/legacy-app-routes.test.cjs _site
          node tests/handover-pack.test.cjs _site
      - name: Check the rendered agent entrance
        run: node tests/agent-orientation.test.cjs _site
      - name: Check the rendered visual explorer
        run: node tests/visual-explorer.test.cjs _site
      - name: Check rendered Library app routes
        run: node tests/library-app-retirement.test.cjs _site
      - name: Check rendered destinations for the ten migrated examples
        run: node tests/ten-library-migration.test.cjs _site
      - name: Check rendered destinations for the next eight examples
        run: |
          node tests/eight-library-migration.test.cjs _site
          node tests/step-one-library-migration.test.cjs _site
          node tests/phase-two-library-migration.test.cjs _site
          node tests/phase-three-library-migration.test.cjs _site
          node tests/phase-four-library-migration.test.cjs _site
          node tests/phase-five-library-migration.test.cjs _site
          node tests/phase-six-library-migration.test.cjs _site
          node tests/phase-seven-library-migration.test.cjs _site
      - name: Save the built site for preview
        if: ${{ always() && hashFiles('_site/index.html') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: public-site-preview
          path: _site
          retention-days: 7
